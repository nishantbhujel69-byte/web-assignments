<!DOCTYPE html>

<body>
    <header>
        <h1>Nishant Web Project</h1>

    <main>
        
        <section>
            <h2>My Favorite Topics</h2>
            <ol>
                <li>Frontend Frameworks</li>

        <section>
            <h2>Contact Form</h2>
            <form action="#" method="POST">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="user_email" placeholder="Enter your email" required>
                
                <br><br>

                <label for="message">Message:</label>
                <textarea id="message" name="user_message" rows="4" placeholder="Write your message here..."></textarea>
                
                <br><br>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
